name: example_app
description: Example app demonstrating core packages with BLoC and go_router.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.36.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core_domain:
  core_network:
  core_storage:
  core_state:
  core_l10n:
  core_ui:
  design_system:
  flutter_bloc: ^9.1.0
  go_router: ^17.3.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
